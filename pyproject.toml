[project]
name = "study-python"
version = "0.1.0"
description = "Python study and interview preparation"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "pandas",
    "httpx>=0.28.1",
    "uvicorn[standard]",
    "boto3",
    "Flask",
    "gunicorn>=23.0.0",
    "python-dotenv",
    "sqlfluff",
    "pymongo==4.17.0",
    "sqlalchemy>=2.0.51",
    "pyjwt>=2.13.0",
    "langchain>=1.3.13",
    "langchain-openai>=1.3.5",
    "langchain-community>=0.4.2",
    "faiss-cpu>=1.14.3",
    "pypdf>=6.14.2",
    "langchain-ollama>=1.1.0",
    "chromadb>=1.5.9",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.14.4",
]

[dependency-groups]
dev = ["mpmath>=1.4.1", "ruff>=0.15.22", "pytest"]

[tool.pytest.ini_options]
pythonpath = [".", "ai-engineering/.production/flask-rag-api/src"]
norecursedirs = [".venv", "venv", ".git", "_tmp", "build", "dist"]


