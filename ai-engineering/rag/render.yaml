services:
  - type: web
    name: flask-rag-api
    runtime: python
    region: oregon
    plan: free
    rootDir: ai-engineering/rag
    buildCommand: uv pip install -r ../../pyproject.toml || pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT rag_api:app
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: CHROMA_DB_DIR
        value: ./_tmp/chroma_db
      - key: CHROMA_COLLECTION
        value: pdf_rag_collection_openai
      - key: FLASK_DEBUG
        value: "false"
