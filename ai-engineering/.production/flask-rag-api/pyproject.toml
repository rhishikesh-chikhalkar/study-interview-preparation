[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flask-rag-api"
version = "0.1.0"
description = "Industry Production-Grade Flask RAG API Microservice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.0",
    "gunicorn>=23.0.0",
    "openai>=1.65.0",
    "chromadb>=0.6.3",
    "pypdf>=5.3.0",
    "langchain-text-splitters>=0.3.6",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flask_rag_api"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
