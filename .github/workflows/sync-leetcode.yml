name: Sync LeetCode to Public Repo

on:
  push:
    branches:
      - main
    paths:
      - 'leetcode/**'
      - 'LeetCode/**'
      - '.github/workflows/sync-leetcode.yml'
  workflow_dispatch:

jobs:
  sync:
    name: Sync LeetCode Directory
    runs-on: ubuntu-latest
    steps:
      - name: Validate Secret Configuration
        env:
          SYNC_TOKEN: ${{ secrets.LEETCODE_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Secret 'LEETCODE_SYNC_TOKEN' is not configured in repository Settings -> Secrets and variables -> Actions."
            echo "Please create a GitHub PAT with repo write access and add it as 'LEETCODE_SYNC_TOKEN'."
            exit 1
          fi

      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          path: private-repo
          fetch-depth: 0

      - name: Checkout Target Public Repository
        uses: actions/checkout@v4
        with:
          repository: rhishikesh-chikhalkar/leetcode-solutions
          token: ${{ secrets.LEETCODE_SYNC_TOKEN }}
          path: public-repo

      - name: Sync Files to Public Repository
        run: |
          # Detect directory casing if present (leetcode or LeetCode)
          SOURCE_DIR="private-repo/leetcode"
          if [ ! -d "$SOURCE_DIR" ]; then
            SOURCE_DIR="private-repo/LeetCode"
          fi

          echo "Syncing from $SOURCE_DIR to public-repo/leetcode/"

          # Clean up legacy solution files from public-repo root
          find public-repo -maxdepth 1 -name '[0-9]*.py' -delete
          rm -rf public-repo/tests

          # Create public-repo/leetcode destination folder
          mkdir -p public-repo/leetcode

          # Sync source contents into public-repo/leetcode/
          rsync -av --delete \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='.pytest_cache' \
            --exclude='.DS_Store' \
            "${SOURCE_DIR}/" public-repo/leetcode/

          # Ensure a helpful README exists in public-repo root
          if [ ! -f public-repo/README.md ] || [ $(wc -l < public-repo/README.md) -le 3 ]; then
            cat << 'EOF' > public-repo/README.md
          # LeetCode Solutions

          A curated collection of LeetCode problem solutions with detailed explanations, time/space complexity analysis, and comprehensive automated test suites.

          ## Repository Structure

          - [\`leetcode/\`](./leetcode) - Solution implementations in Python
          - [\`leetcode/tests/\`](./leetcode/tests) - Pytest unit tests for all solutions

          ---
          *Automatically synchronized from development workspace.*
          EOF
            # Strip leading 10-space indentation from generated README.md
            sed -i 's/^          //' public-repo/README.md
          fi

          cd public-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "No changes to sync."
          else
            git commit -m "sync: place solutions in leetcode/ subfolder [skip ci]"
            git push origin main
          fi
